<script async defer src="https://buttons.github.io/buttons.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const themeSelect = document.querySelector('select[onchange*="data-theme-pack"]');
    if (!themeSelect) return;

    const themes = [
      { value: 'default', label: 'Slate', color: '#6366f1' },
      { value: 'marine', label: 'Marine', color: '#0ea5e9' },
      { value: 'matcha', label: 'Matcha', color: '#16a34a' },
      { value: 'solar', label: 'Solar', color: '#f59e0b' },
      { value: 'dracula', label: 'Night', color: '#a855f7' },
    ];
    const allowedValues = new Set(themes.map((theme) => theme.value));
    const savedTheme = localStorage.getItem('hb-theme-pack');
    const activeTheme = allowedValues.has(savedTheme) ? savedTheme : 'default';

    themeSelect.innerHTML = themes
      .map((theme) => `<option value="${theme.value}">${theme.label}</option>`)
      .join('');
    themeSelect.classList.add('ez-theme-select');
    themeSelect.value = activeTheme;
    document.documentElement.setAttribute('data-theme-pack', activeTheme);
    localStorage.setItem('hb-theme-pack', activeTheme);

    const themeWrap = themeSelect.parentElement;
    if (themeWrap) {
      themeWrap.classList.add('ez-theme-wrap');
      themeSelect.classList.add('ez-native-theme-select');

      const picker = document.createElement('div');
      picker.className = 'ez-theme-picker';
      picker.innerHTML = `
        <button class="ez-theme-button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="ez-theme-swatch" aria-hidden="true"></span>
          <span class="ez-theme-label"></span>
        </button>
        <div class="ez-theme-menu" role="listbox"></div>
      `;
      themeWrap.appendChild(picker);

      const button = picker.querySelector('.ez-theme-button');
      const label = picker.querySelector('.ez-theme-label');
      const swatch = picker.querySelector('.ez-theme-swatch');
      const menu = picker.querySelector('.ez-theme-menu');

      const setTheme = (value) => {
        themeSelect.value = value;
        document.documentElement.setAttribute('data-theme-pack', value);
        localStorage.setItem('hb-theme-pack', value);
        const theme = themes.find((item) => item.value === themeSelect.value) || themes[0];
        swatch.style.background = theme.color;
        label.textContent = theme.label;
        menu.querySelectorAll('.ez-theme-option').forEach((option) => {
          const isSelected = option.dataset.theme === value;
          option.setAttribute('aria-selected', String(isSelected));
        });
      };

      menu.innerHTML = themes
        .map((theme) => `
          <button class="ez-theme-option" type="button" role="option" data-theme="${theme.value}">
            <span class="ez-theme-swatch" style="background:${theme.color}" aria-hidden="true"></span>
            <span>${theme.label}</span>
          </button>
        `)
        .join('');

      setTheme(activeTheme);

      button.addEventListener('click', () => {
        const isOpen = picker.classList.toggle('is-open');
        button.setAttribute('aria-expanded', String(isOpen));
      });

      menu.addEventListener('click', (event) => {
        const option = event.target.closest('.ez-theme-option');
        if (!option) return;
        setTheme(option.dataset.theme);
        picker.classList.remove('is-open');
        button.setAttribute('aria-expanded', 'false');
      });

      document.addEventListener('click', (event) => {
        if (picker.contains(event.target)) return;
        picker.classList.remove('is-open');
        button.setAttribute('aria-expanded', 'false');
      });
    }
  });
</script>
